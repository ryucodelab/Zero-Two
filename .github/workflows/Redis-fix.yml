name: Create Redis Fix Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  redis-fix:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create Redis-fix branch
        run: |
          git checkout -b Redis-fix

      - name: Check ZIP
        run: |
          ls -lh
          unzip -l Zero-Two-main.zip | head -50

      - name: Extract patch
        run: |
          mkdir patch
          unzip -o Zero-Two-main.zip -d patch

          echo "Extracted:"
          ls -la patch

      - name: Apply patch
        run: |
          if [ -d "patch/Zero-Two-main" ]; then
            cp -r patch/Zero-Two-main/* .
          else
            cp -r patch/* .
          fi

      - name: Create changelog
        run: |
          echo "Zero-Two Redis Fix Update" > CHANGELOG_REDIS_FIX.txt
          echo "" >> CHANGELOG_REDIS_FIX.txt
          echo "Version: Redis-fix-v1.0" >> CHANGELOG_REDIS_FIX.txt
          echo "" >> CHANGELOG_REDIS_FIX.txt
          echo "Changes:" >> CHANGELOG_REDIS_FIX.txt
          echo "- Fixed Redis localhost configuration" >> CHANGELOG_REDIS_FIX.txt
          echo "- Improved Redis connection handling" >> CHANGELOG_REDIS_FIX.txt
          echo "- Updated configuration compatibility" >> CHANGELOG_REDIS_FIX.txt
          echo "- Applied stability improvements" >> CHANGELOG_REDIS_FIX.txt
          echo "" >> CHANGELOG_REDIS_FIX.txt
          echo "Generated by GitHub Actions" >> CHANGELOG_REDIS_FIX.txt

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          git commit -m "Apply Redis localhost fix"

      - name: Push Redis-fix branch
        run: |
          git push origin Redis-fix

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: redis-fix-v1.0
          name: Zero-Two Redis Fix v1.0
          body: |
            Redis configuration fix release.

            Changes:
            - Fixed Redis localhost issue
            - Improved Redis handling
            - Updated configuration compatibility
          files: CHANGELOG_REDIS_FIX.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
