name: Create Redis Fix Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  redis-fix:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create Redis-fix branch
        run: |
          git checkout -b Redis-fix

      - name: Extract Zero-Two patch
        run: |
          unzip -o Zero-Two-main.zip -d patch

      - name: Apply patch files
        run: |
          cp -r patch/Zero-Two-main/* .

      - name: Create changelog
        run: |
          cat <<EOF > CHANGELOG_REDIS_FIX.txt
          Zero-Two Redis Fix Update

          Version:
          Redis-fix

          Changes:
          - Fixed Redis connection forcing localhost configuration
          - Improved Redis compatibility
          - Updated configuration handling
          - Applied stability improvements

          Files:
          - Updated Telegram bot core modules
          - Updated Redis related configuration

          Notes:
          This patch was generated automatically using GitHub Actions.

          Generated by:
          github-actions[bot]
          EOF

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          git commit -m "Fix Redis localhost configuration"

      - name: Push Redis-fix branch
        run: |
          git push origin Redis-fix

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: redis-fix-v1.0
          name: Zero-Two Redis Fix v1.0
          body: |
            ## Redis Fix Update

            This release contains fixes for Redis localhost configuration.

            ### Changes
            - Fixed Redis connection handling
            - Improved Redis compatibility
            - Updated configuration behavior

            See CHANGELOG_REDIS_FIX.txt for details.
          files: |
            CHANGELOG_REDIS_FIX.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
