name: Create Redis Fix Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  redis-fix:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create Redis-fix branch
        run: |
          git checkout -b Redis-fix

      - name: Check ZIP file
        run: |
          ls -lh
          unzip -l Zero-Two-main.zip | head -50

      - name: Extract Zero-Two patch
        run: |
          mkdir patch
          unzip -o Zero-Two-main.zip -d patch

          echo "=== Extract Result ==="
          ls -la patch

      - name: Find extracted structure
        run: |
          echo "=== Files ==="
          find patch -maxdepth 3 -type f | head -100

      - name: Apply patch files
        run: |
          if [ -d "patch/Zero-Two-main" ]; then
            echo "Detected Zero-Two-main folder"
            cp -r patch/Zero-Two-main/* .
          else
            echo "Detected direct archive"
            cp -r patch/* .
          fi

      - name: Create changelog
        run: |
          cat <<EOF > CHANGELOG_REDIS_FIX.txt
# Zero-Two Redis Fix Update

## Version
Redis-fix-v1.0

## Changes

- Fixed Redis configuration forcing localhost connection
- Improved Redis connection handling
- Updated configuration compatibility
- Applied stability improvements

## Modified Area

- Telegram bot core
- Redis related configuration
- Runtime stability

## Notes

This patch was generated automatically using GitHub Actions.

Generated by:
github-actions[bot]
EOF

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          git commit -m "Apply Redis localhost fix"

      - name: Push Redis-fix branch
        run: |
          git push origin Redis-fix

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: redis-fix-v1.0
          name: Zero-Two Redis Fix v1.0
          body: |
            # Zero-Two Redis Fix

            This release contains Redis configuration fixes.

            ## Changes
            - Fixed Redis localhost forcing issue
            - Improved Redis compatibility
            - Updated configuration handling

            Full changelog included.
          files: |
            CHANGELOG_REDIS_FIX.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
